# Builds a signed Android APK from index.html (Capacitor) and attaches it to a GitHub Release.
# Trigger: push a tag like v0.2.0  (git tag v0.2.0 && git push origin v0.2.0)  or run manually.
name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 0.2.0)'
        default: '0.2.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF_NAME" == v* && "$GITHUB_REF_TYPE" == tag ]]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Create Capacitor project
        run: |
          mkdir -p app/www && cd app
          cp ../index.html ../manifest.webmanifest ../icon-192.png ../icon-512.png www/
          npm init -y >/dev/null
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "de.lroeseler.cpower",
            "appName": "C*Power",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "backgroundColor": "#d4d0c8"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Portrait lock, icons, version, signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd app/android
          # portrait only
          sed -i 's/<activity /<activity android:screenOrientation="portrait" /' app/src/main/AndroidManifest.xml
          # launcher icons: plain PNGs, drop the adaptive-icon XML so they are used on every API level
          RES=app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26 $RES/drawable-v24 $RES/drawable/ic_launcher_background.xml
          for d in $RES/mipmap-*; do
            cp ../../android-assets/icon.png $d/ic_launcher.png
            cp ../../android-assets/icon-round.png $d/ic_launcher_round.png
            cp ../../android-assets/icon.png $d/ic_launcher_foreground.png
          done
          # keystore: secret if provided, else the public fallback key
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > $RUNNER_TEMP/release.keystore
            echo "KS_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "KS_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "KS_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
          else
            echo "KS_FILE=$GITHUB_WORKSPACE/android-assets/cpower.p12" >> $GITHUB_ENV
            echo "KS_PASSWORD=cpower-public" >> $GITHUB_ENV
            echo "KS_ALIAS=cpower" >> $GITHUB_ENV
          fi
          python3 ../../android-assets/patch_gradle.py app/build.gradle "${{ github.run_number }}" "${{ steps.v.outputs.name }}"
          grep -n "signingConfig\|versionCode\|versionName" app/build.gradle

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir out
          cp app/android/app/build/outputs/apk/release/app-release.apk "out/C-Power-${{ steps.v.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: C-Power-apk
          path: out/*.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: C*Power ${{ steps.v.outputs.name }}
          files: out/*.apk
          body: |
            Android APK of the [C*Power web app](https://lukasroeseler.github.io/c-power/) (portrait, works offline).
            Download the `.apk`, open it on your phone and allow installs from this source.
